name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 실제 .fig 통합 테스트(FIGMA_TEST_FILE)는 원본을 저장소에 두지 않으므로 여기서는 건너뛴다.
      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      - name: Audit (high and above)
        run: npm audit --audit-level=high
